[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semidft"
version = "0.1.0"
description = "Research-oriented semiconductor DFT workflow automation using Quantum ESPRESSO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ase>=3.23",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pymatgen>=2024.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "scipy>=1.13",
    "seekpath>=2.1",
    "spglib>=2.5",
    "typer>=0.12",
]

[project.scripts]
semidft = "semidft.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/semidft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Quantum ESPRESSO executables and pseudopotentials",
    "scientific: scientific benchmark validation tests",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

