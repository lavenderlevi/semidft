schema_version: "1.0.0"

material:
  id: germanium-diamond
  formula: Ge
  name: Germanium

structure:
  source: data/structures/Ge.cif
  standardization:
    target: primitive
    symprec_angstrom: 0.001
  validation:
    allow_disorder: false
    check_minimum_distances: true

method:
  engine: quantum-espresso
  exchange_correlation: PBE
  pseudopotentials:
    library: SSSP
    library_version: "2.0"
    accuracy: efficiency
    catalog_path: configs/pseudopotentials/sssp-pbe.yaml
  cutoffs:
    policy: pseudopotential_recommended
    ecutwfc_ry: 40.0
    ecutrho_ry: 320.0
  spin:
    mode: non_spin_polarized

calculations:
  relaxation:
    enabled: true
    calculation: vc-relax
    force_tolerance_ev_per_angstrom: 0.01
    pressure_tolerance_gpa: 0.05
  scf:
    enabled: true
    calculation: scf
    conv_thr_ry: 1.0e-8
    kpoints: [10, 10, 10]
    offset: [0, 0, 0]
  bands:
    enabled: true
    kpath: seekpath
    points_per_segment: 30
  dos:
    enabled: true
    kpoints: [16, 16, 16]

execution:
  backend: cpu_hybrid
  mpi_ranks: 4
  npool: 4
  omp_threads: 1

storage:
  preserve_raw_outputs: true
  save_intermediate_structures: true
